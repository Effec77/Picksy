<!DOCTYPE html>
<html>
<head>
  <title>Test Gemini API</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 10px 20px; margin: 10px; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Test Gemini API</h1>
  
  <input type="text" id="apiKey" placeholder="Enter API Key" style="width: 400px; padding: 8px;">
  <br><br>
  
  <button onclick="listModels()">1. List Available Models</button>
  <button onclick="testGeneration()">2. Test Generation</button>
  
  <div id="result"></div>
  
  <script>
    async function listModels() {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        alert('Please enter API key');
        return;
      }
      
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>Loading...</p>';
      
      try {
        // Try to list models
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${apiKey}`);
        const data = await response.json();
        
        resultDiv.innerHTML = '<h3>Available Models:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (error) {
        resultDiv.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
      }
    }
    
    async function testGeneration() {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        alert('Please enter API key');
        return;
      }
      
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>Testing generation...</p>';
      
      // Try different model names
      const modelsToTry = [
        'gemini-pro',
        'gemini-1.5-pro',
        'gemini-1.5-flash',
        'gemini-1.0-pro'
      ];
      
      for (const model of modelsToTry) {
        try {
          console.log('Trying model:', model);
          
          const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: 'Say hello' }]
              }]
            })
          });
          
          if (response.ok) {
            const data = await response.json();
            resultDiv.innerHTML = `<h3>✅ Working Model: ${model}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            console.log('✅ Working model:', model);
            return;
          } else {
            console.log('❌ Failed:', model, response.status);
          }
        } catch (error) {
          console.log('❌ Error with', model, error.message);
        }
      }
      
      resultDiv.innerHTML = '<p style="color: red;">❌ None of the models worked. Check console for details.</p>';
    }
  </script>
</body>
</html>
