name: Continuous Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd src/api-gateway && npm ci

    - name: Build application
      run: |
        cd src/api-gateway && npm run build

    - name: Run database migrations
      run: |
        cd src/api-gateway && npm run migrate
      env:
        NODE_ENV: staging
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add actual deployment commands here
      env:
        STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        STAGING_URL: ${{ secrets.STAGING_URL }}

    - name: Run smoke tests
      run: |
        cd src/api-gateway && npm run test:smoke
      env:
        TEST_URL: ${{ secrets.STAGING_URL }}
        API_KEY: ${{ secrets.STAGING_API_KEY }}

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    needs: [deploy-staging]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd src/api-gateway && npm ci

    - name: Build application
      run: |
        cd src/api-gateway && npm run build

    - name: Create backup
      run: |
        echo "Creating production backup..."
        # Add backup commands here
      env:
        BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    - name: Run database migrations
      run: |
        cd src/api-gateway && npm run migrate
      env:
        NODE_ENV: production
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add actual deployment commands here
      env:
        PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
        PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

    - name: Run health checks
      run: |
        cd src/api-gateway && npm run test:health
      env:
        TEST_URL: ${{ secrets.PRODUCTION_URL }}
        API_KEY: ${{ secrets.PRODUCTION_API_KEY }}

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed, initiating rollback..."
        # Add rollback commands here
      env:
        ROLLBACK_KEY: ${{ secrets.ROLLBACK_KEY }}

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  publish-extension:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd src/extension && npm ci

    - name: Build extension
      run: |
        cd src/extension && npm run build

    - name: Package extension
      run: |
        cd src/extension && npm run package

    - name: Publish to Chrome Web Store
      run: |
        cd src/extension && npm run publish:chrome
      env:
        CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    - name: Publish to Firefox Add-ons
      run: |
        cd src/extension && npm run publish:firefox
      env:
        FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
        FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false